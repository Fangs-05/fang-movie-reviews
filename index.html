<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FANG – Film Appreciation Night Guild</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#1b0609;--bg2:#2a0a10;--velvet:#6b0f1e;--gold:#d9ae4e;--gold2:#8f6e26;--ink:#f3e8d2;--mute:#b9a587;--line:rgba(217,174,78,.28);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 19px/1.5 'Cormorant Garamond',Georgia,serif}
h1,h2,h3,.disp{font-family:'Bodoni Moda','Didot',Georgia,serif;margin:0}
.curtain{height:46px;background:repeating-linear-gradient(90deg,#4a0814 0 38px,#7a1226 38px 70px,#5a0a1a 70px 96px);border-bottom:3px solid var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.6)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 5vw;border-bottom:1px solid var(--line);background:var(--bg2)}
.logo{font:900 44px 'Bodoni Moda',serif;letter-spacing:.14em;color:var(--gold);text-shadow:0 0 18px rgba(217,174,78,.35);cursor:pointer}
.logo small{display:block;font:600 14px 'Cormorant Garamond',serif;letter-spacing:.06em;color:var(--mute);text-shadow:none}
nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,.btn{font:700 16px 'Cormorant Garamond',serif;background:var(--gold);color:#2a0a10;border:0;padding:8px 18px;cursor:pointer;border-radius:2px}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:26px 5vw 60px}
h2{font-size:28px;margin:34px 0 14px;color:var(--gold);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{width:150px;flex:none;cursor:pointer}
.grid .card{width:auto}
.poster{aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border:1px solid var(--gold);outline:1px solid var(--gold2);outline-offset:-6px;position:relative}
.poster b{font:700 19px/1.15 'Bodoni Moda',serif}
.poster span{font-size:14px;color:var(--ink);opacity:.85}
.rank{position:absolute;top:-10px;left:-8px;background:var(--gold);color:#2a0a10;font:900 18px 'Bodoni Moda',serif;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.meta{margin-top:6px;font-size:15px;color:var(--mute)}
.st{color:var(--gold);letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);padding:3px 13px;border-radius:99px;cursor:pointer;font-size:16px;color:var(--ink);background:transparent;font-weight:600}
.chip.on{background:var(--gold);color:#2a0a10;border-color:var(--gold)}
input,select,textarea{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:9px 12px;font:500 18px 'Cormorant Garamond',serif;border-radius:2px;margin:4px 0 12px}
label{font-size:15px;color:var(--mute)}
.panel{background:var(--bg2);border:1px solid var(--line);padding:20px;max-width:460px;margin:20px auto}
.det{display:grid;grid-template-columns:230px 1fr;gap:28px}
@media(max-width:640px){.det{grid-template-columns:1fr}.det .poster{max-width:220px}.logo{font-size:34px}}
.pick{font-size:34px;cursor:pointer;color:var(--gold2);user-select:none}
.pick span.on{color:var(--gold)}
.rev{border-bottom:1px solid var(--line);padding:12px 0}
.rev i{color:var(--mute);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#2a0a10;padding:10px 22px;font-weight:700;z-index:9}
.err{color:#ff9d8f;min-height:22px}
.mute{color:var(--mute)}

.tabs{display:flex;gap:6px}.tabs button{background:transparent;color:var(--mute);border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 14px;font-size:18px}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:20;padding:16px;overflow-y:auto}
.modal .panel{margin:0;width:100%;max-width:520px;max-height:95vh;overflow-y:auto;border-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emo{display:flex;gap:8px;margin:6px 0 4px}.emo button{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:6px 0;font-size:26px;line-height:1.1}
.emo button small{display:block;font-size:13px;color:var(--mute)}.emo button.on{border-color:var(--gold);background:var(--velvet)}
.bar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 44px;gap:10px;align-items:center;margin:6px 0;font-size:16px}
.bar div{background:var(--bg2);height:14px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar b{color:var(--gold);text-align:right}
</style></head>
<body>
<div class="curtain"></div>
<header><div class="logo" onclick="go('')" tabindex="0">FANG<small>Now showing: your verdict</small></div>
<nav class="tabs" id="nav"><button data-t="" onclick="go('')">Movies</button><button data-t="my" onclick="go('my')">My Reviews</button><button data-t="admin" onclick="go('admin')">Admin</button></nav></header>
<main id="app"></main>
<script>
/* ===== CONFIG: paste your Google Apps Script web app URL (ends with /exec) ===== */
const API='https://script.google.com/macros/library/d/1ECYK7w1lqRqYNWecoV3QAXUGT_mJuUpeXv5NijjLyDEcLH3QKRVgF1tc/1';
/* ================================================================================ */
const GEN=['Drama','Crime','Thriller','Romance','Sci-Fi','Comedy','War','Fantasy','Musical','Mystery'];
const QUICK=['Masterpiece','Edge of my seat','Superb performances','Slow but worth it','Made me cry','Rewatch-worthy','Overrated','Not for me'];
const EMO=['😡','😕','😐','🙂','😍'],WORD=['Awful','Meh','Okay','Good','Loved it'];
const DIST=['Balod','Baloda Bazar','Balrampur','Bastar','Bemetara','Bijapur','Bilaspur','Dantewada','Dhamtari','Durg','Gariaband','Gaurela-Pendra-Marwahi','Janjgir-Champa','Jashpur','Kabirdham','Kanker','Khairagarh-Chhuikhadan-Gandai','Kondagaon','Korba','Koriya','Mahasamund','Manendragarh-Chirmiri-Bharatpur','Mohla-Manpur-Ambagarh Chowki','Mungeli','Narayanpur','Raigarh','Raipur','Rajnandgaon','Sakti','Sarangarh-Bilaigarh','Sukma','Surajpur','Surguja'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let dev=ls('fang_dev',null);if(!dev){dev=Math.random().toString(36).slice(2)+Date.now().toString(36);lset('fang_dev',dev)}
let D={movies:[],reviews:[],at:0},genre='All',q='',rate=0,qk='',toastT,adm=null,A=null;
try{adm=JSON.parse(sessionStorage.getItem('fang_adm'))}catch(e){}
const mv=id=>D.movies.find(m=>m.id==id);
const stars=a=>'★'.repeat(Math.round(a))+'☆'.repeat(5-Math.round(a));
const dfmt=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleDateString()};
async function call(action,body){
 const get=action==='data';
 const r=await fetch(get?API+'?action=data':API,get?{}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body})});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'Request failed');return j}
async function load(force){if(!force&&D.at&&Date.now()-D.at<45000)return;
 const j=await call('data');
 D.movies=j.movies.map(x=>({id:+x.id,t:x.title,y:+x.year,d:x.director,g:String(x.genres).split(',').map(s=>s.trim()).filter(Boolean),b:x.blurb,r:+x.seedRating||0,c:+x.seedCount||0}));
 D.reviews=j.reviews.map(x=>({id:x.id,m:+x.movieId,s:+x.stars,q:x.quick,t:x.comment,n:x.name,g:x.gender,d:x.district,ts:x.ts}));D.at=Date.now()}
function stat(m){const rs=D.reviews.filter(r=>r.m==m.id);const n=m.c+rs.length;const a=n?(m.r*m.c+rs.reduce((s,r)=>s+r.s,0))/n:0;return{n,a,pop:n*a}}
function poster(m,rank){const h=GEN.indexOf(m.g[0])*36+350;return `<div class="card" onclick="go('m-${m.id}')" tabindex="0" onkeydown="if(event.key==='Enter')go('m-${m.id}')"><div class="poster" style="background:linear-gradient(160deg,hsl(${h%360} 55% 22%),#1b0609 85%)">${rank?`<div class="rank">${rank}</div>`:''}<span>${esc(m.g.join(' / '))}</span><b>${esc(m.t)}</b></div><div class="meta">${m.y} · <span class="st">${stat(m).a.toFixed(1)}★</span></div></div>`}
function toast(t){clearTimeout(toastT);document.querySelectorAll('.toast').forEach(e=>e.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);toastT=setTimeout(()=>d.remove(),2600)}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
function setup(msg){$('#app').innerHTML=`<div class="panel"><h2 style="margin-top:0">Setup needed</h2><p>${esc(msg)}</p><button onclick="location.reload()">Try again</button></div>`}
async function route(){
 if(API.startsWith('PASTE'))return setup('Paste your Google Apps Script web app URL at the top of index.html. See README.md.');
 const h=location.hash.slice(1);
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===(h.startsWith('m-')?'':h)));
 if(!D.at)$('#app').innerHTML='<p class="mute">Opening the house…</p>';
 try{await load(h==='')}catch(e){return setup('Cannot reach the sheet: '+e.message)}
 if(h==='my')return mine();
 if(h==='admin')return admin();
 if(h.startsWith('m-')&&mv(h.slice(2))){movie(mv(h.slice(2)));return scrollTo(0,0)}
 home();scrollTo(0,0)}
const myList=()=>ls('fang_my',[]);
function forYou(){const my=myList();const w={};my.forEach(r=>{const m=mv(r.m);if(m)m.g.forEach(g=>w[g]=(w[g]||0)+(r.s-3))});
 const seen=new Set(my.map(r=>r.m));const dist=((ls('fang_me',{})).district||'').toLowerCase();
 const loc=dist?D.reviews.filter(r=>r.s>=4&&(r.d||'').toLowerCase()===dist):[];
 const list=D.movies.filter(m=>!seen.has(m.id)).map(m=>({m,s:m.g.reduce((a,g)=>a+(w[g]||0),0)+loc.filter(r=>r.m==m.id).length*.7+stat(m).a*.4}));
 return{list:list.sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.m),has:my.length>0}}
function home(){const top=[...D.movies].sort((a,b)=>stat(b).pop-stat(a).pop).slice(0,10);const f=forYou();
$('#app').innerHTML=`<h1 style="font-size:40px;max-width:640px">Lights down. Pick a film and tell us how it felt, from 😡 to 😍.</h1>
<h2>Top 10 tonight</h2><div class="row">${top.map((m,i)=>poster(m,i+1)).join('')}</div>
<h2>Reserved for you</h2>${f.has?'':'<p class="mute">Review a film and this list will learn your taste. Until then, here is a guess from your district and what is popular.</p>'}<div class="row">${f.list.map(m=>poster(m)).join('')}</div>
<h2>Browse by genre</h2><div class="chips">${['All',...GEN].map(g=>`<button class="chip ${g===genre?'on':''}" onclick="genre='${g}';home()">${g}</button>`).join('')}</div>
<input id="q" placeholder="Search the full programme" value="${esc(q)}" oninput="q=this.value;grid()"><div class="grid" id="grid"></div>`;grid()}
function grid(){const l=D.movies.filter(m=>(genre==='All'||m.g.includes(genre))&&m.t.toLowerCase().includes(q.toLowerCase()));$('#grid').innerHTML=l.length?l.map(m=>poster(m)).join(''):'<p class="mute">No films match. Try another genre or title.</p>'}
function movie(m){const s=stat(m);const rs=D.reviews.filter(r=>r.m==m.id).reverse();const sim=D.movies.filter(x=>x.id!==m.id).map(x=>({x,k:x.g.filter(g=>m.g.includes(g)).length*10+stat(x).a})).filter(o=>o.k>=10).sort((a,b)=>b.k-a.k).slice(0,6).map(o=>o.x);const h=GEN.indexOf(m.g[0])*36+350;
$('#app').innerHTML=`<p><a href="#" style="color:var(--gold)" onclick="go('');return false">← Back to the lobby</a></p>
<div class="det"><div class="poster" style="background:linear-gradient(160deg,hsl(${h%360} 55% 22%),#1b0609 85%)"><span>${esc(m.g.join(' / '))}</span><b style="font-size:26px">${esc(m.t)}</b></div>
<div><h1 style="font-size:42px">${esc(m.t)}</h1><p class="mute">${m.y} · Directed by ${esc(m.d)}</p><p>${esc(m.b)}</p>
<p><span class="st" style="font-size:26px">${stars(s.a)}</span> <b>${s.a.toFixed(1)}</b> <span class="mute">from ${s.n} reviews</span></p>
<button onclick="openReview(${m.id})">Write a review</button></div></div>
<h2>If you liked this</h2>${sim.length?`<div class="row">${sim.map(x=>poster(x)).join('')}</div>`:'<p class="mute">No similar films yet.</p>'}
<h2>Audience reviews</h2>${rs.length?rs.map(r=>`<div class="rev"><span class="st">${stars(r.s)}</span> ${EMO[r.s-1]||''} <b>${esc(r.n)}</b> <i>${esc(r.g)} · ${esc(r.d)} · ${dfmt(r.ts)}</i><div>${esc(r.t||r.q)}</div></div>`).join(''):'<p class="mute">No reviews yet. Be the first to take a bow.</p>'}`}
function openReview(id){const m=mv(id),me=ls('fang_me',{});rate=0;qk='';
 const d=document.createElement('div');d.className='modal';d.id='md';d.onclick=e=>{if(e.target===d)closeM()};
 d.innerHTML=`<div class="panel"><h2 style="margin-top:0">${esc(m.t)}</h2><p class="mute">Your details help us understand audiences across Chhattisgarh.</p>
<label>Name</label><input id="rn" value="${esc(me.name||'')}" maxlength="60" autocomplete="name">
<div class="two"><div><label>Gender</label><select id="rg"><option value="">Select</option><option ${me.gender==='Male'?'selected':''}>Male</option><option ${me.gender==='Female'?'selected':''}>Female</option></select></div>
<div><label>Age</label><input id="ra" type="number" min="5" max="100" value="${esc(me.age||'')}"></div></div>
<label>District</label><input id="rd" list="dl" value="${esc(me.district||'')}" placeholder="e.g. Durg"><datalist id="dl">${DIST.map(x=>`<option>${x}</option>`).join('')}</datalist>
<label>Your rating</label><div class="emo" id="emo">${EMO.map((e,i)=>`<button onclick="setRate(${i+1})" aria-label="${i+1} stars">${e}<small>${i+1}★ ${WORD[i]}</small></button>`).join('')}</div>
<label>Quick review</label><div class="chips">${QUICK.map(t=>`<button class="chip" onclick="setQk(this)">${t}</button>`).join('')}</div>
<label>Comment (optional)</label><textarea id="rc" rows="2" maxlength="300"></textarea><div class="err" id="er"></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="ghost" onclick="closeM()">Cancel</button><button id="sb" onclick="submitReview(${id})">Submit review</button></div></div>`;
 document.body.appendChild(d);$('#rn').focus()}
const closeM=()=>{const d=$('#md');if(d)d.remove()};
function setRate(i){rate=i;document.querySelectorAll('#emo button').forEach((b,k)=>b.classList.toggle('on',k===i-1))}
function setQk(b){const on=b.classList.contains('on');document.querySelectorAll('.modal .chip.on').forEach(c=>c.classList.remove('on'));qk=on?'':b.textContent;if(!on)b.classList.add('on')}
async function submitReview(id){const v=k=>$('#'+k).value.trim(),e=t=>$('#er').textContent=t;
 const p={name:v('rn'),gender:v('rg'),age:+v('ra'),district:v('rd')};
 if(!p.name||!p.gender||!p.district)return e('Please fill in name, gender and district.');
 if(!(p.age>=5&&p.age<=100))return e('Enter a valid age.');
 if(!rate)return e('Choose a rating.');
 const b=$('#sb');b.disabled=true;b.textContent='Submitting…';
 try{await call('review',{device:dev,movieId:id,stars:rate,quick:qk,comment:v('rc'),...p})}catch(x){b.disabled=false;b.textContent='Submit review';return e(x.message)}
 lset('fang_me',p);const my=myList().filter(r=>r.m!==id);my.push({m:id,s:rate,t:v('rc')||qk,ts:new Date().toISOString()});lset('fang_my',my);
 closeM();toast('Review submitted');await load(true);if(location.hash.slice(1)==='m-'+id)movie(mv(id))}
function mine(){const my=myList().slice().reverse();
$('#app').innerHTML=`<h1>My Reviews</h1><p class="mute">Reviews you submitted from this device.</p>${my.length?my.map(r=>{const m=mv(r.m);return `<div class="rev"><b style="cursor:pointer;color:var(--gold)" onclick="go('m-${r.m}')">${esc(m?m.t:'Removed film')}</b> <span class="st">${stars(r.s)}</span> ${EMO[r.s-1]} <i>${dfmt(r.ts)}</i><div>${esc(r.t)}</div></div>`}).join(''):'<p class="mute">Nothing yet. Open a film and write your first review.</p>'}`}
async function admin(){
 if(!adm){$('#app').innerHTML=`<div class="panel"><h2 style="margin-top:0">Admin login</h2><p class="mute">Sign in to see the dashboard.</p><label>Username</label><input id="au" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><div class="err" id="er"></div><button onclick="adminLogin()">Sign in</button></div>`;return}
 $('#app').innerHTML='<p class="mute">Loading dashboard…</p>';
 try{A=(await call('adminData',adm)).reviews}catch(e){adm=null;sessionStorage.removeItem('fang_adm');return admin()}
 const real=D.movies.map(m=>{const rs=A.filter(r=>+r.movieId===m.id);return{l:m.t,v:rs.length?rs.reduce((s,r)=>s+ +r.stars,0)/rs.length:0,n:rs.length}}).filter(x=>x.n).sort((a,b)=>b.v-a.v).slice(0,10);
 const dc={};A.forEach(r=>{const k=r.district||'Unknown';dc[k]=(dc[k]||0)+1});const dt=Object.entries(dc).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=dt.length?dt[0][1]:1;
 const bar=(l,v,p,t)=>`<div class="bar"><span>${esc(l)}</span><div><i style="width:${p}%"></i></div><b>${t}</b></div>`;
 $('#app').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h1>Admin Dashboard</h1><button class="ghost" onclick="adm=null;sessionStorage.removeItem('fang_adm');admin()">Sign out</button></div><p class="mute">Live data from Google Sheets. ${A.length} reviews.</p>
<h2>Average rating by movie</h2>${real.length?real.map(x=>bar(x.l,x.v,x.v*20,x.v.toFixed(1))).join(''):'<p class="mute">No reviews yet.</p>'}
<h2>Reviews by district (top 8)</h2>${dt.length?dt.map(([k,n])=>bar(k,n,n/mx*100,n)).join(''):'<p class="mute">No reviews yet.</p>'}
<h2>All reviews</h2><p><button onclick="exportCsv()">Export CSV</button> <button class="ghost" onclick="exportXlsx()">Export Excel</button></p>
<div class="tablewrap"><table><tr><th>Date</th><th>Film</th><th>★</th><th>Name</th><th>M/F</th><th>Age</th><th>District</th><th>Review</th><th></th></tr>${[...A].reverse().map(r=>`<tr><td>${dfmt(r.ts)}</td><td>${esc((mv(r.movieId)||{t:'?'}).t)}</td><td class="st">${r.stars}</td><td>${esc(r.name)}</td><td>${esc(r.gender)}</td><td>${esc(r.age)}</td><td>${esc(r.district)}</td><td>${esc(r.comment||r.quick)}</td><td><button class="ghost" onclick="delRev('${esc(r.id)}')">Delete</button></td></tr>`).join('')}</table></div>
<h2>Add a film</h2><div class="panel" style="max-width:none;margin:0"><label>Title</label><input id="at"><div class="two"><div><label>Year</label><input id="ay" type="number"></div><div><label>Director</label><input id="ad"></div></div><label>Genres (comma separated: ${GEN.join(', ')})</label><input id="ag"><label>Synopsis</label><input id="ab"><div class="err" id="er"></div><button onclick="addMovie()">Add to programme</button></div>
<h2>Films (${D.movies.length})</h2><div class="tablewrap"><table>${D.movies.map(m=>`<tr><td>${esc(m.t)} (${m.y})</td><td>${esc(m.g.join(', '))}</td><td><button class="ghost" onclick="delMovie(${m.id})">Remove</button></td></tr>`).join('')}</table></div>`}
async function adminLogin(){const u=$('#au').value.trim(),p=$('#ap').value;adm={user:u,pass:p};
 try{await call('adminData',adm)}catch(e){adm=null;return $('#er').textContent=/auth/i.test(e.message)?'Username or password is wrong.':e.message}
 try{sessionStorage.setItem('fang_adm',JSON.stringify(adm))}catch(e){}admin()}
async function act(action,body,msg){try{await call(action,{...adm,...body});toast(msg);await load(true);admin()}catch(e){toast(e.message)}}
function delRev(id){act('delReview',{id},'Review deleted')}
function delMovie(id){if(confirm('Remove this film and its reviews?'))act('delMovie',{id},'Film removed')}
function addMovie(){const t=$('#at').value.trim(),y=+$('#ay').value,g=$('#ag').value.split(',').map(x=>GEN.find(k=>k.toLowerCase()===x.trim().toLowerCase())).filter(Boolean);
 if(!t||!y||!g.length)return $('#er').textContent='Title, year and at least one valid genre are required.';
 act('addMovie',{title:t,year:y,director:$('#ad').value.trim()||'Unknown',genres:g.join(', '),blurb:$('#ab').value.trim()||'No synopsis yet.'},'Film added')}
const rows=()=>A.map(r=>({Date:r.ts,Film:(mv(r.movieId)||{}).t||'',Stars:r.stars,Quick:r.quick,Comment:r.comment,Name:r.name,Gender:r.gender,Age:r.age,District:r.district}));
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCsv(){const r=rows(),k=Object.keys(r[0]||{Date:1});const c=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 save(new Blob(['\ufeff'+[k.join(',')].concat(r.map(o=>k.map(x=>c(o[x])).join(','))).join('\n')],{type:'text/csv'}),'fang-reviews.csv')}
function exportXlsx(){if(typeof XLSX==='undefined')return toast('Excel library did not load');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows()),'Reviews');
 save(new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]),'fang-reviews.xlsx')}
addEventListener('hashchange',route);route();
</script></body></html>
